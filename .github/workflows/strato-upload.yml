# Lädt die geprüfte Seite per SFTP auf den STRATO-Webspace.
# Startet nur von Hand (Actions → „Upload zu STRATO“ → Run workflow) und nur von main.
# Jeder Upload ist Außenwirkung: Feld „freigabe“ mit Name und Datum ausfüllen.
#
# Repository-Secrets (Settings → Secrets and variables → Actions):
#   STRATO_SFTP_HOST         z. B. ssh.strato.de
#   STRATO_SFTP_USER         SFTP-Benutzer aus dem STRATO-Kundenlogin
#   STRATO_SFTP_PASSWORD     nur dort eintragen, nie in Chat oder Repo
#   STRATO_SFTP_ZIEL         Zielordner des Webspace, auf den die Domain zeigt
#   STRATO_SFTP_KNOWN_HOSTS  Host-Key-Zeile(n), siehe README „Deployment“
#
# Es wird nichts auf dem Server gelöscht. Erst Assets, dann HTML, damit keine
# Seite auf Dateien zeigt, die noch fehlen.
name: Upload zu STRATO

on:
  workflow_dispatch:
    inputs:
      freigabe:
        description: 'Freigabe: Name und Datum (z. B. "Anselm Hanz, 17.11.2026")'
        required: true
        type: string
      livegang:
        description: 'Echter Livegang: Launch-Prüfung muss grün sein (kein RÜCKFRAGE, kein noindex)'
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: strato-upload
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Freigabe prüfen
        env:
          FREIGABE: ${{ inputs.freigabe }}
          LIVEGANG: ${{ inputs.livegang }}
        run: |
          if ! printf '%s' "$FREIGABE" | grep -Eq '[[:alpha:]].*[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{4}'; then
            echo "::error::Freigabe braucht Name und Datum, z. B. \"Anselm Hanz, 17.11.2026\"."
            exit 1
          fi
          {
            echo "### Upload zu STRATO"
            echo "- Freigabe: $FREIGABE"
            echo "- Livegang: $LIVEGANG"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:links
      - name: Launch-Prüfung
        if: inputs.livegang
        run: npm run check:launch

      - name: Zugangsdaten prüfen
        env:
          HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          PASS: ${{ secrets.STRATO_SFTP_PASSWORD }}
          ZIEL: ${{ secrets.STRATO_SFTP_ZIEL }}
          KNOWN_HOSTS: ${{ secrets.STRATO_SFTP_KNOWN_HOSTS }}
        run: |
          fehlt=""
          [ -n "$HOST" ] || fehlt="$fehlt STRATO_SFTP_HOST"
          [ -n "$SFTP_USER" ] || fehlt="$fehlt STRATO_SFTP_USER"
          [ -n "$PASS" ] || fehlt="$fehlt STRATO_SFTP_PASSWORD"
          [ -n "$ZIEL" ] || fehlt="$fehlt STRATO_SFTP_ZIEL"
          [ -n "$KNOWN_HOSTS" ] || fehlt="$fehlt STRATO_SFTP_KNOWN_HOSTS"
          if [ -n "$fehlt" ]; then
            echo "::error::Secrets fehlen:$fehlt"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen
        env:
          HOST: ${{ secrets.STRATO_SFTP_HOST }}
          SFTP_USER: ${{ secrets.STRATO_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.STRATO_SFTP_PASSWORD }}
          ZIEL: ${{ secrets.STRATO_SFTP_ZIEL }}
        run: |
          # Host-Key muss bekannt sein, sonst bricht ssh ab (kein Upload auf fremde Server).
          lftp --env-password -u "$SFTP_USER" "sftp://$HOST" <<LFTP
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --no-perms --parallel=4 --exclude-glob *.html dist/ "$ZIEL"
          mirror --reverse --no-perms --parallel=4 dist/ "$ZIEL"
          bye
          LFTP
